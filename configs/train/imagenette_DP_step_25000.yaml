batch_size: 128
gradient_accumulation_steps: 1

optimizer:
  name: "adamw"
  lr: 0.003
lr_scheduler:
  name: "sequential"
  schedulers:
    [
      {name: "linear", start_factor: 0.1, end_factor: 1.0, total_iters: 2500},
      {name: "constant", factor: 1.0},
      {name: "cosine", T_max: 5000}
    ]
  milestones: [2500, 20000]
  interval: "step"
ema:
  enabled: true
  decay: 0.999
  update_after_step: 0

num_workers: 4

max_steps: 25000
label_smoothing: 0.11
