defaults:
  - target_model: classification/vit_b
  - generative_oracle: imagenette
  - guidance_model: entropy
  - dataset: imagenet_100
  - train: imagenet_100_DP
  - callbacks: classification_DP
  - _self_

project_name: generative_active_learning
exp_name: imagenet_100_DP

seed: [42]
deterministic: true
profiler: simple
load_best_checkpoint: false
logger_type: wandb # csv, wandb

num_initial_labeled_real_samples: 0 # number of real data
num_initial_labeled_generated_samples: 32000 # number of generated data used as the initial labeled set

train:
  batch_size: 1024
  optimizer:
    name: "adamw"
    lr: 0.001
  mixed_precision: false
  ema:
    enabled: true
    decay: 0.999
    update_after_step: 0
  max_epochs: -1
  gradient_accumulation_steps: 1
  mixup_alpha: 0.5
  cutmix_alpha: 1.0
  increasing_val_freq: true
  gradient_clip_val: 1.0
  num_workers: 1

callbacks:
  early_stopping:
    patience: 6

dataset:
  num_holdout_samples: 16000
  generated_data_for_holdout: true
  selected_by_clip_score: true

generative_oracle:
  num_generated_sample_per_cycle: 16000
  batch_size: 2
  inference_steps: 50
  mixed_precision: true
  scheduler:
    name: euler
