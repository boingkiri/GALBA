name: imagenet_100
# Images are loaded from the HuggingFace Hub dataset "clane9/imagenet-100" (downloaded automatically).
# The class names used for the text prompts are read from `imagenet_100_idx_label_mapping_path`.
dataset_path: data/imagenet_100
imagenet_100_idx_label_mapping_path: data/imagenet_100/imagenet100_label.yaml

num_classes: 100
transform:
  train:
    - convert_to_rgb: {}
    - totensor: {}
    - random_resized_crop:
        size: 224
    - random_horizontal_flip:
        p: 0.5
    - mixup:
        alpha: 0.5
        num_classes: 100
    - cutmix:
        alpha: 1.0
        num_classes: 100
    - normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
  test:
    - convert_to_rgb: {}
    - totensor: {}
    - resize:
        size: 256
    - center_crop:
        size: 224
    - normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]

# The normalization values are based on 
#https://github.com/danielchyeh/ImageNet-100-Pytorch/blob/5ae5a42f74a23e8107aa060067fc355f16007d91/main_IN100.py#L113